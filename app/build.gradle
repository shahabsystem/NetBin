plugins { id 'com.android.application' }

android {
    namespace 'com.github.xfalcon.vhosts'
    compileSdk 36
    defaultConfig {
        applicationId "com.github.xfalcon.vhosts"
        minSdk 21
        targetSdk 36
        versionCode 50
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }
    flavorDimensions += "CHANNEL"
    productFlavors {
        googleplay { dimension "CHANNEL"; buildConfigField("boolean", "IS_GooglePlay", "true") }
        github { dimension "CHANNEL"; buildConfigField("boolean", "IS_GooglePlay", "false") }
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        debug { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    testImplementation 'junit:junit:4.13.2'
}
