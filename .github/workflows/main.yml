name: DNS Eye Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build GitHub Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleGithubDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-eye-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Upload mapping when available
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dns-eye-build-reports
          path: |
            app/build/outputs/**
            build/reports/**
          if-no-files-found: ignore
