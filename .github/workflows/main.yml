name: Build VHosts Pro

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build GitHub debug APK
        run: ./gradlew --no-daemon assembleGithubDebug
      - name: Build GitHub release APK
        run: ./gradlew --no-daemon assembleGithubRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vhosts-pro-apks
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
